name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
      - run: pip install -q -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: CLI smoke
        run: |
          ttywood --help
          ttywood schema > /dev/null
          ttywood validate examples/fzf_screenplay.yaml
          ttywood config

  image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ttywood/docker
          push: false
          tags: ttywood:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
