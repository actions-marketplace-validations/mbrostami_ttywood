<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="ttywood">
  <style>.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style>
  <rect width="1200" height="400" fill="#14141c"/>
  <!-- icon: terminal window with a clapperboard title bar -->
  <g transform="translate(96,80)">
    <rect x="0" y="0" width="300" height="240" rx="24" fill="#1a1a24" stroke="#3a3a4c" stroke-width="5"/>
    <clipPath id="bar"><rect x="0" y="0" width="300" height="46" rx="24"/></clipPath>
    <g clip-path="url(#bar)">
      <rect x="0" y="0" width="300" height="46" fill="#1a1a24"/>
      <rect x="0" y="34" width="300" height="12" fill="#1a1a24"/>
      <g fill="#f2f2f7">
        <polygon points="120,0 150,0 132,46 102,46"/>
        <polygon points="180,0 210,0 192,46 162,46"/>
        <polygon points="240,0 270,0 252,46 222,46"/>
        <polygon points="300,0 330,0 312,46 282,46"/>
      </g>
    </g>
    <line x1="0" y1="46" x2="300" y2="46" stroke="#3a3a4c" stroke-width="4"/>
    <circle cx="30" cy="23" r="8" fill="#ff5f57"/>
    <circle cx="56" cy="23" r="8" fill="#febc2e"/>
    <circle cx="82" cy="23" r="8" fill="#28c840"/>
    <!-- prompt, underscore, blinking block cursor -->
    <text x="40" y="172" class="mono" font-size="76" font-weight="700" fill="#f2f2f7">&gt;_</text>
    <rect x="150" y="104" width="46" height="84" rx="6" fill="#7c9cff">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- wordmark -->
  <text x="450" y="235" class="mono" font-size="118" font-weight="700" letter-spacing="-3">
    <tspan fill="#7c9cff">tty</tspan><tspan fill="#f2f2f7">wood</tspan>
  </text>
  <text x="456" y="290" class="mono" font-size="24" fill="#8a8fa8" letter-spacing="5">CLI tools, cloned, run, reviewed.</text>
</svg>
